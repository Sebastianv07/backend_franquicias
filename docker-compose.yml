services:
  mysql:
    image: mysql:8.4
    container_name: franquicias-mysql
    environment:
      MYSQL_DATABASE: franquicias_db
      MYSQL_USER: ${DB_USERNAME:-franquicias_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-franquicias_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    container_name: franquicias-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/franquicias_db
      DB_USERNAME: ${DB_USERNAME:-franquicias_user}
      DB_PASSWORD: ${DB_PASSWORD:-franquicias_password}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
