spring.application.name=franquicias

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/franquicias_db}
spring.datasource.username=${DB_USERNAME:franquicias_user}
spring.datasource.password=${DB_PASSWORD:franquicias_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

server.port=8080